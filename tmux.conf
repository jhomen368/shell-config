# ~/.tmux.conf — managed from shell-config/tmux.conf (symlinked by install.sh)
# Minimal defaults, no plugins. Needs tmux 2.1+ (for the mouse option).

# ──────────────────────────────────────────────────────
# GENERAL
# ──────────────────────────────────────────────────────
set -g mouse on                  # Click to select panes/windows, scroll, resize
set -g history-limit 50000       # Scrollback lines per pane (default 2000)

# ──────────────────────────────────────────────────────
# NUMBERING
# Start at 1 so the first window matches the leftmost number key
# ──────────────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on       # Close a window and the rest close the gap
